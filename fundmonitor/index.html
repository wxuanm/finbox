<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">基金实时监控面板</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="page-shell">
        <div class="dashboard-grid">
            <section class="panel unified-panel">
                <div class="unified-header">
                    <div class="header-left">
                        <div class="hero-badge" data-i18n="heroBadge">实时净值监控</div>
                        <h1 data-i18n="heroTitle">基金实时监控面板</h1>
                    </div>
                    <div class="header-right">
                        <div class="mini-stats">
                            <div class="stat-item"><span data-i18n="statTotal">监控总数</span> <strong id="fundCountStat">0</strong></div>
                            <div class="stat-item"><span data-i18n="statPositive">上涨基金</span> <strong id="positiveCountStat">0</strong></div>
                            <div class="stat-item"><span data-i18n="statNegative">下跌基金</span> <strong id="negativeCountStat">0</strong></div>
                            <div class="stat-item"><span data-i18n="statLastRefresh">最新刷新</span> <strong id="lastRefreshStat">--:--</strong></div>
                        </div>
                        <div class="header-actions">
                            <button id="themeBtn" class="action-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
                            <button id="langBtn" class="action-btn" onclick="toggleLang()">EN</button>
                        </div>
                    </div>
                </div>

                <div class="controls-toolbar">
                    <div class="left-actions">
                        <button class="primary-btn" onclick="promptAddGroup()">➕ <span data-i18n="addGroupTitle">新建分组</span></button>
                        <button class="secondary-btn" onclick="refreshData()" data-i18n="refreshBtn">刷新全部</button>
                    </div>
                    <div class="toolbar-hint">
                        💡 <span data-i18n="tableSub">双击任意行可跳转基金分析页，点击列头支持排序。</span>
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="fundTable">
                        <thead>
                            <tr>
                                <th onclick="sortTable(0)"><span data-i18n="colCode">代码</span><span class="sort-icon"></span></th>
                                <th onclick="sortTable(1)"><span data-i18n="colName">名称</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(2)"><span data-i18n="colEstNav">估算净值</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(3)"><span data-i18n="colEstChange">估算涨幅</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(4)"><span data-i18n="colNav">净值</span><span class="sort-icon"></span></th>
                                <th onclick="sortTable(5)"><span data-i18n="colNavDate">净值日期</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(6)"><span data-i18n="colAccNav">累计净值</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(7)"><span data-i18n="colNavChange">净值涨幅</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(8)"><span data-i18n="colPrevNav">前一净值</span><span class="sort-icon"></span></th>
                                <th onclick="sortTable(9)"><span data-i18n="colPrevNavDate">前一净值日期</span><span class="sort-icon"></span></th>
                                <th onclick="sortTable(10)"><span data-i18n="colManager">基金经理</span><span class="sort-icon"></span></th>
                                <th><span data-i18n="colAction">操作</span></th>
                            </tr>
                        </thead>
                        <!-- Group tbodies will be rendered here -->
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>

    <!-- Analysis Modal -->
    <div id="analysisModal" class="modal-backdrop" onclick="closeModal(event)">
        <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle" data-i18n="modalTitle">基金深度分析</h3>
                <button class="modal-close" onclick="closeModal()" data-i18n-title="closeBtnTitle" title="关闭" aria-label="Close">✖</button>
            </div>
            <div class="modal-body" style="overflow-y: auto; padding: 24px;">
                <div id="modalLoader" class="modal-loader">
                    <div class="loader"></div>
                </div>
                <div id="analysisContent" class="analysis-content" style="display: none; opacity: 0; transition: opacity 0.4s ease;">
                    <!-- Native content will be rendered here -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
