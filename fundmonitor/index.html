<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">基金实时监控面板</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M12 46h40M16 38l10-10 8 7 14-20' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="pullRefreshIndicator" class="pull-refresh-indicator" aria-hidden="true">下拉刷新</div>
    <div class="page-shell">
        <header class="global-header">
            <div class="brand-area">
                <div class="brand-mark" aria-hidden="true">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 19V5m0 14h16M8 15l3-3 3 2 5-7"></path></svg>
                </div>
                <div class="brand-copy">
                    <div class="brand-meta">
                        <div class="hero-badge" data-i18n="heroBadge">实时净值监控</div>
                    </div>
                    <h1 data-i18n="heroTitle">基金实时监控面板</h1>
                    <p data-i18n="heroDesc">聚焦净值、估算涨幅与基金经理信息，用更清晰的视觉层级和更高效的表格浏览体验，帮助你快速发现重点基金动态。</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="themeBtn" class="action-btn" onclick="toggleTheme()" title="切换主题">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
                <button id="langBtn" class="action-btn" onclick="toggleLang()">EN</button>
                <div class="header-divider"></div>
                
                <button class="primary-btn icon-action-btn main-new-group-btn" onclick="showInlineNewGroup()" data-i18n-title="addGroupTitle" title="新建分组" aria-label="新建分组">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5A2.5 2.5 0 015.5 5H9l2 2h7.5A2.5 2.5 0 0121 9.5v7A2.5 2.5 0 0118.5 19h-13A2.5 2.5 0 013 16.5v-9z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M12 11v5m2.5-2.5h-5"></path></svg>
                </button>
                <button class="secondary-btn icon-action-btn main-refresh-btn" onclick="refreshData()" data-i18n-title="refreshBtn" title="刷新" aria-label="刷新">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
                <div class="mobile-more-actions">
                    <button class="action-btn icon-action-btn" onclick="toggleHeaderMenu(event)" data-i18n-title="moreActions" title="更多" aria-label="更多">...</button>
                    <div class="header-action-menu">
                        <button onclick="showInlineNewGroup()" data-i18n-title="addGroupTitle" title="新建分组">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5A2.5 2.5 0 015.5 5H9l2 2h7.5A2.5 2.5 0 0121 9.5v7A2.5 2.5 0 0118.5 19h-13A2.5 2.5 0 013 16.5v-9z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M12 11v5m2.5-2.5h-5"></path></svg>
                            <span data-i18n="addGroupTitle">新建分组</span>
                        </button>
                        <button onclick="refreshData()" data-i18n-title="refreshBtn" title="刷新">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            <span data-i18n="refreshBtn">刷新</span>
                        </button>
                        <button onclick="toggleTheme()" data-i18n-title="themeDark" title="切换到暗黑模式">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                            <span data-i18n="themeDark">切换到暗黑模式</span>
                        </button>
                        <button onclick="toggleLang()">
                            <span class="menu-icon-text">文</span>
                            <span id="mobileLangMenuText">EN</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="dashboard-grid">
            <section class="panel unified-panel">
                <div class="dashboard-stats-grid">
                    <div class="stat-card">
                        <div class="stat-title" data-i18n="statTotal">监控总数</div>
                        <div class="stat-value" id="fundCountStat">0</div>
                    </div>
                    <div class="stat-card positive-card">
                        <div class="stat-title" data-i18n="statPositive">上涨基金</div>
                        <div class="stat-value positive" id="positiveCountStat">0</div>
                    </div>
                    <div class="stat-card negative-card">
                        <div class="stat-title" data-i18n="statNegative">下跌基金</div>
                        <div class="stat-value negative" id="negativeCountStat">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title" data-i18n="statLastRefresh">最新刷新</div>
                        <div class="stat-value" id="lastRefreshStat">--:--</div>
                    </div>
                </div>

                <div class="table-headline">
                    <div>
                        <h2 data-i18n="tableTitle">基金行情明细</h2>
                        <p data-i18n="tableSub">双击任意行可跳转基金分析页，点击列头支持排序。</p>
                    </div>
                    <span class="table-hint" data-i18n="monitorListSub">支持批量输入基金代码，使用英文逗号分隔</span>
                </div>

                <div class="table-responsive">
                    <table id="fundTable">
                        <thead>
                            <tr>
                                <th onclick="sortTable(0)"><span data-i18n="colName">名称</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(1)"><span data-i18n="colEstNav">估算净值</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(2)"><span data-i18n="colEstChange">估算涨幅</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(3)"><span data-i18n="colNav">净值</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(4)"><span data-i18n="colNavChange">净值涨幅</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(5)"><span data-i18n="colPrevNav">前一净值</span><span class="sort-icon"></span></th>
                                <th onclick="sortTable(6)"><span data-i18n="colManager">基金经理</span><span class="sort-icon"></span></th>
                                <th><span data-i18n="colAction">操作</span></th>
                            </tr>
                        </thead>
                        <!-- Group tbodies will be rendered here -->
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script type="module" src="js/app.js"></script>

    <!-- Analysis Modal -->
    <div id="analysisModal" class="modal-backdrop" onclick="closeModal(event)">
        <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle" data-i18n="modalTitle">基金深度分析</h3>
                <button class="modal-close" onclick="closeModal()" data-i18n-title="closeBtnTitle" title="关闭" aria-label="Close">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="modalLoader" class="modal-loader">
                    <div class="loader"></div>
                </div>
                <div id="analysisContent" class="analysis-content">
                    <!-- Native content will be rendered here -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
