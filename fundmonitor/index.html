<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">基金实时监控面板</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover-color: #1d4ed8;
            --primary-soft: rgba(37, 99, 235, 0.12);
            --secondary-color: #0f172a;
            --positive-color: #dc2626;
            --negative-color: #16a34a;
            --text-color: #1e293b;
            --muted-text: #64748b;
            --border-color: #e2e8f0;
            --background-color: linear-gradient(180deg, #eff6ff 0%, #f8fafc 32%, #eef2ff 100%);
            --surface-color: rgba(255, 255, 255, 0.88);
            --surface-strong: #ffffff;
            --table-header-bg: #f8fafc;
            --table-row-hover: #eff6ff;
            --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.12);
            --shadow-md: 0 10px 30px rgba(37, 99, 235, 0.08);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --hero-bg: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(239,246,255,0.88));
            --badge-bg: rgba(255, 255, 255, 0.78);
            --input-bg: rgba(255, 255, 255, 0.92);
            --stat-bg: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(248,250,252,0.95));
            --table-odd-bg: rgba(255, 255, 255, 0.6);
            --chip-bg: rgba(15, 23, 42, 0.04);
            --pill-bg: rgba(148, 163, 184, 0.12);
            --error-bg: rgba(254, 242, 242, 0.92);
            --border-light: rgba(255, 255, 255, 0.5);
        }

        
        [data-theme="dark"] {
            --primary-color: #3b82f6;
            --primary-hover-color: #60a5fa;
            --primary-soft: rgba(59, 130, 246, 0.2);
            --secondary-color: #f8fafc;
            --positive-color: #ef4444;
            --negative-color: #22c55e;
            --text-color: #e2e8f0;
            --muted-text: #94a3b8;
            --border-color: #334155;
            --background-color: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            --surface-color: rgba(30, 41, 59, 0.88);
            --surface-strong: #1e293b;
            --table-header-bg: #0f172a;
            --table-row-hover: #334155;
            --hero-bg: linear-gradient(135deg, rgba(30,41,59,0.9), rgba(15,23,42,0.88));
            --badge-bg: rgba(30, 41, 59, 0.78);
            --input-bg: rgba(30, 41, 59, 0.92);
            --stat-bg: linear-gradient(180deg, rgba(30,41,59,0.95), rgba(15,23,42,0.95));
            --table-odd-bg: rgba(255, 255, 255, 0.02);
            --chip-bg: rgba(255, 255, 255, 0.06);
            --pill-bg: rgba(255, 255, 255, 0.1);
            --error-bg: rgba(127, 29, 29, 0.3);
            --border-light: rgba(255, 255, 255, 0.1);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: var(--background-color);
            color: var(--text-color);
        }

        .page-shell {
            max-width: 1480px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .hero {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 22px;
            padding: 28px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            background: var(--hero-bg);
            backdrop-filter: blur(18px);
            box-shadow: var(--shadow-lg);
        }

        .hero-copy h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 40px);
            line-height: 1.1;
            letter-spacing: -0.03em;
            color: var(--secondary-color);
        }

        .hero-copy p {
            margin: 12px 0 0;
            max-width: 720px;
            color: var(--muted-text);
            font-size: 15px;
            line-height: 1.7;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: var(--badge-bg);
            border: 1px solid rgba(37, 99, 235, 0.12);
            color: var(--primary-color);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: var(--shadow-md);
        }

        .dashboard-grid {
            display: grid;
            gap: 20px;
        }

        .panel {
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow-lg);
        }

        .controls-panel {
            padding: 22px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 20px;
            color: var(--secondary-color);
        }

        .section-heading span {
            color: var(--muted-text);
            font-size: 13px;
        }

        .controls {
            display: grid;
            grid-template-columns: minmax(280px, 1fr) auto auto;
            gap: 12px;
            align-items: center;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap::before {
            content: '🔎';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            opacity: 0.65;
        }

        .controls input[type="text"] {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px 12px 40px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            font-size: 15px;
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }

        .controls input[type="text"]:focus {
            border-color: rgba(37, 99, 235, 0.45);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            transform: translateY(-1px);
        }

        .controls button {
            min-height: 48px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            border: none;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover-color));
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
            box-shadow: var(--shadow-md);
        }

        .controls button:hover {
            transform: translateY(-1px);
        }

        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .secondary-btn {
            color: var(--primary-color) !important;
            background: var(--input-bg) !important;
            border: 1px solid rgba(37, 99, 235, 0.16) !important;
        }

        .stats-strip {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .stat-card {
            padding: 16px 18px;
            border-radius: 18px;
            background: var(--stat-bg);
            border: 1px solid var(--border-color);
        }

        .stat-label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted-text);
            font-size: 12px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--secondary-color);
            letter-spacing: -0.02em;
        }

        .table-panel {
            overflow: hidden;
        }

        .table-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px 22px 0;
        }

        .table-toolbar p {
            margin: 0;
            color: var(--muted-text);
            font-size: 13px;
        }

        .table-responsive {
            overflow-x: auto;
            padding: 14px 0 6px;
        }

        table {
            width: 100%;
            min-width: 1180px;
            border-collapse: separate;
            border-spacing: 0;
            margin: 0;
        }

        th, td {
            border-bottom: 1px solid var(--border-color);
            padding: 14px 16px;
            text-align: left;
            vertical-align: middle;
            background: transparent;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 1;
            background-color: var(--table-header-bg);
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            color: var(--muted-text);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        th .sort-icon {
            margin-left: 8px;
            font-size: 0.9em;
            color: #94a3b8;
        }

        tbody tr {
            transition: background-color 0.16s ease, transform 0.16s ease;
        }

        tbody tr:nth-child(odd) {
            background-color: var(--table-odd-bg);
        }

        tbody tr:hover {
            background-color: var(--table-row-hover);
        }

        td.numerical, th.numerical {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .positive { color: var(--positive-color); font-weight: 700; }
        .negative { color: var(--negative-color); font-weight: 700; }

        .name-cell {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 180px;
        }

        .name-main {
            font-weight: 700;
            color: var(--secondary-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .name-sub {
            font-size: 12px;
            color: var(--muted-text);
        }

        .code-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 84px;
            padding: 7px 10px;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary-color);
            font-weight: 700;
            font-size: 13px;
        }

        .value-chip {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            min-width: 78px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--chip-bg);
        }

        .manager-pill {
            display: inline-flex;
            align-items: center;
            max-width: 130px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--pill-bg);
            color: var(--secondary-color);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .remove-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 10px;
            color: #94a3b8;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }

        .remove-btn:hover {
            color: #dc2626;
            background: rgba(220, 38, 38, 0.08);
            transform: scale(1.04);
        }

        .loader {
            width: 18px;
            height: 18px;
            border: 2px solid #dbeafe;
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-row {
            background-color: var(--error-bg) !important;
        }

        .error-message {
            color: var(--positive-color);
            font-size: 0.92em;
            font-weight: 700;
        }

        #fundTable td:nth-child(6),
        #fundTable td:nth-child(10) {
            white-space: nowrap;
        }

        @media (max-width: 960px) {
            .hero {
                flex-direction: column;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .stats-strip {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .page-shell {
                padding: 18px 12px 28px;
            }

            .hero,
            .controls-panel {
                padding: 18px;
            }

            .stats-strip {
                grid-template-columns: 1fr;
            }
        }
    
        .header-actions {
            position: absolute;
            top: 28px;
            right: 28px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .action-btn {
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(37, 99, 235, 0.2);
            background: var(--badge-bg);
            color: var(--primary-color);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .action-btn:hover {
            background: var(--surface-color);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        @media (max-width: 640px) {
            .header-actions {
                top: 18px;
                right: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <section class="hero">
            <div class="header-actions">
                <button id="themeBtn" class="action-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
                <button id="langBtn" class="action-btn" onclick="toggleLang()">English</button>
            </div>
            <div class="hero-copy">
                <div class="hero-badge" data-i18n="heroBadge">实时净值监控</div>
                <h1 data-i18n="heroTitle">基金实时监控面板</h1>
                <p data-i18n="heroDesc">聚焦净值、估算涨幅与基金经理信息，用更清晰的视觉层级和更高效的表格浏览体验，帮助你快速发现重点基金动态。</p>
            </div>
        </section>

        <div class="dashboard-grid">
            <section class="panel controls-panel">
                <div class="section-heading">
                    <div>
                        <h2 data-i18n="monitorList">监控列表</h2>
                        <span data-i18n="monitorListSub">支持批量输入基金代码，使用英文逗号分隔</span>
                    </div>
                </div>
                <div class="controls">
                    <div class="input-wrap">
                        <input type="text" id="fundCodeInput" data-i18n-placeholder="inputPlaceholder" placeholder="例如：217021, 161725, 004233">
                    </div>
                    <button id="addFundBtn" onclick="addFundCodes()" data-i18n="addFundBtn">添加基金</button>
                    <button class="secondary-btn" onclick="refreshData()" data-i18n="refreshBtn">刷新全部</button>
                </div>
                <div class="stats-strip">
                    <div class="stat-card">
                        <span class="stat-label" data-i18n="statTotal">监控总数</span>
                        <strong class="stat-value" id="fundCountStat">0</strong>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label" data-i18n="statPositive">上涨基金</span>
                        <strong class="stat-value" id="positiveCountStat">0</strong>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label" data-i18n="statNegative">下跌基金</span>
                        <strong class="stat-value" id="negativeCountStat">0</strong>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label" data-i18n="statLastRefresh">最新刷新</span>
                        <strong class="stat-value" id="lastRefreshStat">--:--</strong>
                    </div>
                </div>
            </section>

            <section class="panel table-panel">
                <div class="table-toolbar">
                    <div>
                        <h2 data-i18n="tableTitle">基金行情明细</h2>
                        <p data-i18n="tableSub">双击任意行可跳转基金分析页，点击列头支持排序。</p>
                    </div>
                </div>
                <div class="table-responsive">
                    <table id="fundTable">
                        <thead>
                            <tr>
                                <th onclick="sortTable(0)"><span data-i18n="colCode">代码</span><span class="sort-icon"></span></th>
                                <th onclick="sortTable(1)"><span data-i18n="colName">名称</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(2)"><span data-i18n="colEstNav">估算净值</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(3)"><span data-i18n="colEstChange">估算涨幅</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(4)"><span data-i18n="colNav">净值</span><span class="sort-icon"></span></th>
                                <th onclick="sortTable(5)"><span data-i18n="colNavDate">净值日期</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(6)"><span data-i18n="colAccNav">累计净值</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(7)"><span data-i18n="colNavChange">净值涨幅</span><span class="sort-icon"></span></th>
                                <th class="numerical" onclick="sortTable(8)"><span data-i18n="colPrevNav">前一净值</span><span class="sort-icon"></span></th>
                                <th onclick="sortTable(9)"><span data-i18n="colPrevNavDate">前一净值日期</span><span class="sort-icon"></span></th>
                                <th onclick="sortTable(10)"><span data-i18n="colManager">基金经理</span><span class="sort-icon"></span></th>
                                <th><span data-i18n="colAction">操作</span></th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script>
        
        const i18n = {
            zh: {
                title: "基金实时监控面板",
                heroBadge: "实时净值监控",
                heroTitle: "基金实时监控面板",
                heroDesc: "聚焦净值、估算涨幅与基金经理信息，用更清晰的视觉层级和更高效的表格浏览体验，帮助你快速发现重点基金动态。",
                monitorList: "监控列表",
                monitorListSub: "支持批量输入基金代码，使用英文逗号分隔",
                inputPlaceholder: "例如：217021, 161725, 004233",
                addFundBtn: "添加基金",
                refreshBtn: "刷新全部",
                statTotal: "监控总数",
                statPositive: "上涨基金",
                statNegative: "下跌基金",
                statLastRefresh: "最新刷新",
                tableTitle: "基金行情明细",
                tableSub: "双击任意行可跳转基金分析页，点击列头支持排序。",
                colCode: "代码",
                colName: "名称",
                colEstNav: "估算净值",
                colEstChange: "估算涨幅",
                colNav: "净值",
                colNavDate: "净值日期",
                colAccNav: "累计净值",
                colNavChange: "净值涨幅",
                colPrevNav: "前一净值",
                colPrevNavDate: "前一净值日期",
                colManager: "基金经理",
                colAction: "操作",
                loading: "加载中...",
                waiting: "等待行情返回",
                fetchError: "数据加载失败",
                removeTitle: "移除基金",
                emptyState: '输入基金代码后开始监控。<br><span style="color: var(--muted-text); font-size: 13px;">支持批量添加，建议优先关注核心持仓与观察名单。</span>',
                langSwitch: "English",
                codePrefix: "代码",
                themeDark: "切换到暗黑模式",
                themeLight: "切换到浅色模式"
            },
            en: {
                title: "Fund Real-time Monitor",
                heroBadge: "Real-time NAV Monitor",
                heroTitle: "Fund Real-time Monitor",
                heroDesc: "Focus on NAV, estimated growth, and manager info. Clear visual hierarchy and efficient table layout help you discover key fund dynamics quickly.",
                monitorList: "Watchlist",
                monitorListSub: "Support batch input of fund codes, separated by commas",
                inputPlaceholder: "e.g., 217021, 161725, 004233",
                addFundBtn: "Add Fund",
                refreshBtn: "Refresh",
                statTotal: "Monitored",
                statPositive: "Rising",
                statNegative: "Falling",
                statLastRefresh: "Last Update",
                tableTitle: "Fund Market Details",
                tableSub: "Double-click any row for analysis, click column headers to sort.",
                colCode: "Code",
                colName: "Name",
                colEstNav: "Est. NAV",
                colEstChange: "Est. Change",
                colNav: "NAV",
                colNavDate: "NAV Date",
                colAccNav: "Acc. NAV",
                colNavChange: "NAV Change",
                colPrevNav: "Prev. NAV",
                colPrevNavDate: "Prev. Date",
                colManager: "Manager",
                colAction: "Action",
                loading: "Loading...",
                waiting: "Waiting for data",
                fetchError: "Data fetch failed",
                removeTitle: "Remove Fund",
                emptyState: 'Enter fund codes to start monitoring.<br><span style="color: var(--muted-text); font-size: 13px;">Batch addition supported. Recommended to focus on core holdings.</span>',
                langSwitch: "中文",
                codePrefix: "Code",
                themeDark: "Switch to Dark Mode",
                themeLight: "Switch to Light Mode"
            }
        };

        let currentTheme = localStorage.getItem('fund-monitor-theme') || 'light';

        function applyTheme() {
            document.documentElement.setAttribute('data-theme', currentTheme);
            const themeBtn = document.getElementById('themeBtn');
            if (themeBtn) {
                themeBtn.textContent = currentTheme === 'light' ? '🌙' : '☀️';
                themeBtn.title = currentTheme === 'light' ? i18n[currentLang].themeDark : i18n[currentLang].themeLight;
            }
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('fund-monitor-theme', currentTheme);
            applyTheme();
        }

        let currentLang = localStorage.getItem('fund-monitor-lang') || 'zh';

        function applyLanguage() {
            document.getElementById('pageTitle').textContent = i18n[currentLang].title;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) el.innerHTML = i18n[currentLang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[currentLang][key]) el.placeholder = i18n[currentLang][key];
            });
            
            const langBtn = document.getElementById('langBtn');
            if (langBtn) langBtn.textContent = i18n[currentLang].langSwitch;

            checkEmptyState(); // Refresh empty state message

            // Update existing rows
            Array.from(tableBody.rows).forEach(row => {
                if (row.classList.contains('loading')) {
                    const nameMain = row.querySelector('.name-main');
                    const nameSub = row.querySelector('.name-sub');
                    if (nameMain) nameMain.textContent = i18n[currentLang].loading;
                    if (nameSub) nameSub.textContent = i18n[currentLang].waiting;
                } else if (row.classList.contains('error-row')) {
                    const errorMsg = row.querySelector('.error-message');
                    if (errorMsg) errorMsg.textContent = i18n[currentLang].fetchError;
                } else if (!row.querySelector('td[colspan="12"]')) {
                    const nameSub = row.querySelector('.name-sub');
                    if (nameSub) {
                        const code = row.id.replace('fund-', '');
                        nameSub.textContent = `${i18n[currentLang].codePrefix} ${code}`;
                    }
                }
                const removeBtn = row.querySelector('.remove-btn');
                if (removeBtn) removeBtn.title = i18n[currentLang].removeTitle;
            });
        }

        window.toggleLang = function() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('fund-monitor-lang', currentLang);
            applyLanguage();
            applyTheme();
        }

        const STORAGE_KEY = 'fund-monitor-saved-codes';
        let fundCodes = new Set();
        let currentSortColumn = -1;
        let sortOrder = 1;

        const fundCodeInput = document.getElementById('fundCodeInput');
        const addFundBtn = document.getElementById('addFundBtn');
        const tableBody = document.getElementById('fundTable').tBodies[0];
        const fundCountStat = document.getElementById('fundCountStat');
        const positiveCountStat = document.getElementById('positiveCountStat');
        const negativeCountStat = document.getElementById('negativeCountStat');
        const lastRefreshStat = document.getElementById('lastRefreshStat');

        function formatChangeCell(value) {
            const numericValue = parseFloat(value);
            if (Number.isNaN(numericValue)) {
                return '-';
            }

            let changeClass = '';
            let changeIcon = '';
            if (numericValue > 0) {
                changeClass = 'positive';
                changeIcon = '▲';
            } else if (numericValue < 0) {
                changeClass = 'negative';
                changeIcon = '▼';
            }

            const formattedValue = `${numericValue.toFixed(2)}%`;
            return `<span class="${changeClass}">${changeIcon ? `${changeIcon} ` : ''}${formattedValue}</span>`;
        }

        function updateFundRow(code, fields) {
            const row = document.getElementById(`fund-${code}`);
            if (!row) return;

            const [
                fundCode,
                fundName,
                ,
                ,
                estimatedNav,
                estimatedChange,
                unitNav,
                unitNavDate,
                accumulatedNav,
                navChange,
                previousNav,
                previousNavDate,
                fundManager
            ] = fields;

            const nameCell = row.cells[1];
            nameCell.innerHTML = `
                <div class="name-cell">
                    <span class="name-main" title="${fundName || ''}">${fundName || '-'}</span>
                    <span class="name-sub">${i18n[currentLang].codePrefix} ${fundCode || code}</span>
                </div>
            `;
            nameCell.title = fundName || '';

            row.cells[2].innerHTML = `<span class="value-chip">${estimatedNav || '-'}</span>`;
            row.cells[3].innerHTML = formatChangeCell(estimatedChange);
            row.cells[4].innerHTML = `<span class="value-chip">${unitNav || '-'}</span>`;
            row.cells[5].textContent = unitNavDate || '-';
            row.cells[6].innerHTML = `<span class="value-chip">${accumulatedNav || '-'}</span>`;
            row.cells[7].innerHTML = formatChangeCell(navChange);
            row.cells[8].innerHTML = `<span class="value-chip">${previousNav || '-'}</span>`;
            row.cells[9].textContent = previousNavDate || '-';

            const managerCell = row.cells[10];
            managerCell.innerHTML = `<span class="manager-pill" title="${fundManager || ''}">${fundManager || '-'}</span>`;
            managerCell.title = fundManager || '';

            row.classList.remove('loading', 'error-row');
            updateDashboardStats();
        }

        function fetchDataForCode(code) {
            const existingScript = document.getElementById(`fund-script-${code}`);
            if (existingScript) {
                existingScript.remove();
            }

            const script = document.createElement('script');
            script.id = `fund-script-${code}`;
            script.src = `/api/fundgz?code=${code}&rt=${Date.now()}`;
            script.onload = () => {
                if (window.fundinfo) {
                    const payloadText = `var fundinfo = ${JSON.stringify(window.fundinfo)};`;
                    const match = payloadText.match(/var\s+fundinfo\s*=\s*\[(.*?)\];?/s);
                    if (match) {
                        try {
                            const fields = JSON.parse(`[${match[1]}]`)[0].split(',');
                            updateFundRow(code, fields);
                        } catch (e) {
                            handleFetchError(code);
                        }
                    } else {
                         handleFetchError(code);
                    }
                } else {
                    handleFetchError(code);
                }
                delete window.fundinfo;
                script.remove();
            };
            script.onerror = () => {
                handleFetchError(code);
                script.remove();
            };
            document.head.appendChild(script);
        }

        function handleFetchError(code) {
            const row = document.getElementById(`fund-${code}`);
            if (row) {
                row.classList.add('error-row');
                row.cells[1].innerHTML = `<span class="error-message">${i18n[currentLang].fetchError}</span>`;
                row.cells[2].textContent = '-';
                row.cells[3].textContent = '-';
                row.cells[4].textContent = '-';
                row.cells[5].textContent = '-';
                row.cells[6].textContent = '-';
                row.cells[7].textContent = '-';
                row.cells[8].textContent = '-';
                row.cells[9].textContent = '-';
                row.cells[10].textContent = '-';
                updateDashboardStats();
            }
        }
        
        function addRow(code) {
            const row = tableBody.insertRow();
            row.id = `fund-${code}`;
            row.classList.add('loading');
            row.ondblclick = () => navigateToAnalysis(code);
            
            row.innerHTML = `
                <td><span class="code-badge">${code}</span></td>
                <td>
                    <div class="name-cell">
                        <span class="name-main">${i18n[currentLang].loading}</span>
                        <span class="name-sub">${i18n[currentLang].waiting}</span>
                    </div>
                </td>
                <td class="numerical"><div class="loader"></div></td>
                <td class="numerical">-</td>
                <td class="numerical">-</td>
                <td>-</td>
                <td class="numerical">-</td>
                <td class="numerical">-</td>
                <td class="numerical">-</td>
                <td>-</td>
                <td>-</td>
                <td><button class="remove-btn" onclick="removeFund('${code}')" title="${i18n[currentLang].removeTitle}">✖</button></td>
            `;
            checkEmptyState();
            updateDashboardStats();
        }

        function saveFundCodes() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(fundCodes)));
        }

        function loadSavedFundCodes() {
            try {
                const rawValue = localStorage.getItem(STORAGE_KEY);
                if (!rawValue) {
                    return [];
                }

                const parsed = JSON.parse(rawValue);
                if (!Array.isArray(parsed)) {
                    return [];
                }

                return parsed
                    .map(code => String(code).trim())
                    .filter(code => code !== '');
            } catch (error) {
                return [];
            }
        }

        function addFundCodes(codesFromRestore = null) {
            const codes = (codesFromRestore ?? fundCodeInput.value.trim().split(','))
                .map(code => code.trim())
                .filter(code => code !== '');
            
            let delay = 0;
            codes.forEach(code => {
                if (!fundCodes.has(code)) {
                    fundCodes.add(code);
                    addRow(code);
                    setTimeout(() => fetchDataForCode(code), delay);
                    delay += 100;
                }
            });

            saveFundCodes();
            fundCodeInput.value = '';
            applyLanguage();
            applyLanguage();
            applyTheme();
            updateAddButtonState();
        }
        
        function removeFund(code) {
            fundCodes.delete(code);
            saveFundCodes();
            const row = document.getElementById(`fund-${code}`);
            if (row) row.remove();
            checkEmptyState();
            updateDashboardStats();
        }

        function navigateToAnalysis(code) {
            window.location.href = `Fund Performance Analysis.html?fundCode=${code}`;
        }

        function refreshData() {
            tableBody.innerHTML = '';
            let delay = 0;
            fundCodes.forEach(code => {
                addRow(code);
                setTimeout(() => fetchDataForCode(code), delay);
                delay += 100;
            });
            updateLastRefreshTime();
        }

        function updateLastRefreshTime() {
            const now = new Date();
            lastRefreshStat.textContent = now.toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function updateDashboardStats() {
            const dataRows = Array.from(tableBody.rows).filter(row => !row.querySelector('td[colspan="12"]'));
            fundCountStat.textContent = String(fundCodes.size);

            const positiveCount = dataRows.filter(row => row.cells[3] && row.cells[3].querySelector('.positive')).length;
            const negativeCount = dataRows.filter(row => row.cells[3] && row.cells[3].querySelector('.negative')).length;

            positiveCountStat.textContent = String(positiveCount);
            negativeCountStat.textContent = String(negativeCount);
        }
        
        function checkEmptyState() {
            if (tableBody.rows.length === 0) {
                const row = tableBody.insertRow();
                const cell = row.insertCell(0);
                cell.colSpan = 12;
                cell.style.textAlign = 'center';
                cell.innerHTML = i18n[currentLang].emptyState;
            } else {
                const emptyRow = tableBody.querySelector('td[colspan="12"]');
                if (emptyRow) emptyRow.parentElement.remove();
            }
        }
        
        function updateAddButtonState() {
            addFundBtn.disabled = fundCodeInput.value.trim() === '';
        }

        // Sorting Logic
        function sortTable(column) {
            if (currentSortColumn === column) {
                sortOrder *= -1;
            } else {
                currentSortColumn = column;
                sortOrder = 1;
            }
            
            updateSortIcons(column);
            
            const rows = Array.from(tableBody.rows).filter(row => !row.querySelector('td[colspan="12"]'));
            
            rows.sort((a, b) => {
                const isNumeric = a.cells[column].classList.contains('numerical');

                if (isNumeric) {
                    const textA = a.cells[column].textContent;
                    const textB = b.cells[column].textContent;

                    // Use regex to extract the number, ignoring icons and symbols.
                    const matchA = textA.match(/-?[\d.]+/);
                    const matchB = textB.match(/-?[\d.]+/);

                    const numA = matchA ? parseFloat(matchA[0]) : -Infinity;
                    const numB = matchB ? parseFloat(matchB[0]) : -Infinity;
                    
                    return (numA - numB) * sortOrder;
                } else {
                    const cellA = a.cells[column].textContent.trim();
                    const cellB = b.cells[column].textContent.trim();
                    return cellA.localeCompare(cellB, 'en', {numeric: true}) * sortOrder;
                }
            });
            
            rows.forEach(row => tableBody.appendChild(row));
        }

        function updateSortIcons(column) {
            document.querySelectorAll('#fundTable th').forEach((header, index) => {
                const icon = header.querySelector('.sort-icon');
                if (icon) {
                    if (index === column) {
                        icon.textContent = sortOrder === 1 ? '▲' : '▼';
                    } else {
                        icon.textContent = '';
                    }
                }
            });
        }
        
        // Event Listeners
        fundCodeInput.addEventListener('input', updateAddButtonState);
        fundCodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addFundCodes();
            }
        });

        // Initial setup
        document.addEventListener('DOMContentLoaded', () => {
            updateAddButtonState();
            checkEmptyState();
            updateDashboardStats();

            const savedCodes = loadSavedFundCodes();
            if (savedCodes.length > 0) {
                addFundCodes(savedCodes);
                updateLastRefreshTime();
            }
        });
    </script>
</body>
</html>
